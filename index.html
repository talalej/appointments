<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zakazivač</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #020617;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        padding: 12px 16px;
        border-bottom: 1px solid #1e293b;
        background: #0b1220;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .title {
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .hint {
        font-size: 12px;
        color: #94a3b8;
      }
      .frame-wrap {
        flex: 1;
        height: 100vh;
        width: 100%;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        background: #020617;
      }
      .error {
        margin: 16px;
        padding: 12px 14px;
        border: 1px solid #334155;
        border-radius: 10px;
        background: #0f172a;
        color: #f8fafc;
        display: none;
      }
      .error strong {
        color: #fbbf24;
      }
      .login-overlay {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="title">Zakazivač</div>
      <div id="auth-status">
        <div id="g_id_signin"></div>
      </div>
    </div>

    <div id="error" class="error"></div>

    <div id="login-prompt" class="login-overlay">
      <h2>Dobrodošli</h2>
      <p class="hint">Molimo prijavite se putem Google naloga kako biste pristupili Zakazivač aplikaciji.</p>
    </div>

    <div id="frame-container" class="frame-wrap" style="display: none">
      <iframe id="app-frame" title="Zakazivač"></iframe>
    </div>

    <script src="config.js"></script>
    <script>
      var frame = document.getElementById("app-frame");
      var errorBox = document.getElementById("error");
      var loginPrompt = document.getElementById("login-prompt");
      var frameContainer = document.getElementById("frame-container");

      var cfg = window.APP_CONFIG || {};
      var webAppUrl = String(cfg.appsScriptWebAppUrl || "").trim();
      var clientId = String(cfg.googleClientId || "").trim();

      // Funkcija koja se poziva kada Google vrati token
      function handleCredentialResponse(response) {
        var idToken = response.credential;

        if (!webAppUrl) {
          showError("Aplikacija nije konfigurisana.");
          return;
        }

        // Sakrivamo topbar i login poruku, a prikazujemo iframe preko celog ekrana
        document.querySelector(".topbar").style.display = "none";
        loginPrompt.style.display = "none";
        frameContainer.style.display = "block";
        frame.src = webAppUrl + "?token=" + encodeURIComponent(idToken);
      }

      function showError(msg) {
        errorBox.style.display = "block";
        errorBox.innerHTML = "<strong>" + msg + "</strong>";
      }

      window.addEventListener("DOMContentLoaded", function () {
        if (!webAppUrl || !clientId) {
          showError("Aplikacija nije konfigurisana.");
          return;
        }

        var attempts = 0;
        var maxAttempts = 100;

        var checkGoogleInterval = setInterval(function () {
          attempts++;

          if (window.google && window.google.accounts) {
            clearInterval(checkGoogleInterval);

            // Inicijalizacija sa omogućenom automatskom prijavom
            google.accounts.id.initialize({
              client_id: clientId,
              callback: handleCredentialResponse,
              auto_select: true,
            });

            // Prikaz standardnog dugmeta
            google.accounts.id.renderButton(document.getElementById("g_id_signin"), { theme: "outline", size: "small" });

            // Otvara Google prompt za brzu prijavu
            google.accounts.id.prompt();
          } else if (attempts >= maxAttempts) {
            clearInterval(checkGoogleInterval);
            showError("Nije moguće učitati Google Sign-In servise. Proverite internet vezu ili AdBlocker.");
          }
        }, 100);
      });
    </script>
  </body>
</html>
