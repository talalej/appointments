<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zakazivač</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #020617;
        color: #e2e8f0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      .topbar {
        padding: 12px 16px;
        border-bottom: 1px solid #1e293b;
        background: #0b1220;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .title {
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .hint {
        font-size: 12px;
        color: #94a3b8;
      }
      .frame-wrap {
        min-height: 0;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        min-height: calc(100vh - 52px);
        background: #020617;
      }
      .error {
        margin: 16px;
        padding: 12px 14px;
        border: 1px solid #334155;
        border-radius: 10px;
        background: #0f172a;
        color: #f8fafc;
        display: none;
      }
      .error strong {
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div id="error" class="error"></div>

    <div class="frame-wrap">
      <iframe id="app-frame" title="Zakazivač"></iframe>
    </div>

    <script src="config.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        var errorBox = document.getElementById("error");
        var frame = document.getElementById("app-frame");

        var cfg = window.APP_CONFIG || {};
        var webAppUrl = String(cfg.appsScriptWebAppUrl || "").trim();

        if (!webAppUrl) {
          errorBox.style.display = "block";
          errorBox.innerHTML = "<strong>Zakazivač aplikacija nije konfigurisana.</strong>";
          return;
        }

        frame.src = webAppUrl;
      });
    </script>
  </body>
</html>
