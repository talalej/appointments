<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Manifest & Meta tagovi -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zakazivač" />

    <title>Zakazivač</title>

    <!-- IKONICA SAJTA -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #020617;
        color: #e2e8f0;
      }
      .title {
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .hint {
        font-size: 14px;
        color: #94a3b8;
        margin-top: 8px;
      }
      .login-logo {
        width: 84px;
        height: 84px;
        object-fit: contain;
        margin-bottom: 16px;
        border-radius: 16px;
      }

      /* PRILAGOĐEN IFRAME KONTEJNER ZA MOBILNE EKRANE */
      .frame-wrap-full {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        /* Fallback za starije browsere, pa moderni dvh i safe-area podrška */
        height: 100vh;
        height: 100dvh;
        z-index: 99999;
        background: #020617;
        /* Prilagođavanje za notch i status bar na iOS uređajima */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .error {
        margin: 16px;
        padding: 12px 14px;
        border: 1px solid #334155;
        border-radius: 10px;
        background: #0f172a;
        color: #f8fafc;
        display: none;
      }
      .error strong {
        color: #fbbf24;
      }
      .login-overlay {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
        min-height: calc(100dvh - 60px);
      }
      .login-overlay h2 {
        margin: 0;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div id="error" class="error"></div>

    <div id="login-prompt" class="login-overlay">
      <img src="favicon.png" alt="Logo" class="login-logo" />
      <h2>Dobrodošli u Zakazivač</h2>
      <p class="hint">Molimo prijavite se putem Google naloga kako biste pristupili aplikaciji.</p>
      <div id="auth-status" class="hint" style="margin-top: 12px"></div>
      <div id="g_id_signin"></div>
    </div>

    <div id="frame-container" style="display: none">
      <iframe id="app-frame" title="Zakazivač"></iframe>
    </div>

    <script src="config.js"></script>
    <script>
      var frame = document.getElementById("app-frame");
      var errorBox = document.getElementById("error");
      var loginPrompt = document.getElementById("login-prompt");
      var frameContainer = document.getElementById("frame-container");

      var cfg = window.APP_CONFIG || {};
      var webAppUrl = String(cfg.appsScriptWebAppUrl || "").trim();
      var clientId = String(cfg.googleClientId || "").trim();
      var appsScriptOrigin = "";

      function getOriginFromUrl(url) {
        try {
          return new URL(String(url || "").trim()).origin;
        } catch (e) {
          return "";
        }
      }

      // Dinamičko preračunavanje visine na mobilnim uređajima
      function podesiVisinuEkrana() {
        var vh = window.innerHeight;
        if (frameContainer && frameContainer.style.display !== "none") {
          frameContainer.style.height = vh + "px";
        }
      }

      function jeLiTokenValidan(token) {
        try {
          var base64Url = token.split(".")[1];
          var base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
          var jsonPayload = decodeURIComponent(
            atob(base64)
              .split("")
              .map(function (c) {
                return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
              })
              .join("")
          );
          var payload = JSON.parse(jsonPayload);
          var sada = Math.floor(Date.now() / 1000);
          return payload.exp > sada + 300;
        } catch (e) {
          return false;
        }
      }

      function resetujPrijavu(poruka) {
        localStorage.removeItem("user_google_token");
        frameContainer.style.display = "none";
        frame.src = "about:blank";
        loginPrompt.style.display = "flex";
        document.body.style.overflow = "auto";

        if (poruka) {
          showError(poruka);
        }
      }

      function otvoriAplikaciju(idToken) {
        if (!webAppUrl) {
          showError("Greška: Aplikacija nije konfigurisana.");
          return;
        }

        loginPrompt.style.display = "none";
        document.body.style.overflow = "hidden";

        frameContainer.className = "frame-wrap-full";
        frameContainer.style.display = "block";

        podesiVisinuEkrana();

        frame.src = webAppUrl + "?token=" + encodeURIComponent(idToken) + "&parentOrigin=" + encodeURIComponent(window.location.origin);
      }

      function handleCredentialResponse(response) {
        var idToken = response.credential;
        localStorage.setItem("user_google_token", idToken);
        otvoriAplikaciju(idToken);
      }

      function showError(msg) {
        errorBox.style.display = "block";
        errorBox.textContent = String(msg || "");
      }

      // Slušamo poruke iz Apps Script iframe-a
      window.addEventListener("message", function (event) {
        if (!appsScriptOrigin || event.origin !== appsScriptOrigin) {
          return;
        }

        if (event.data && event.data.type === "AUTH_ERROR") {
          resetujPrijavu("Pristup je odbijen. Vaš e-mail se ne nalazi na listi odobrenih korisnika.");
        }
      });

      // Ažuriranje visine pri promeni orijentacije ili skrolovanju adresne trake
      window.addEventListener("resize", podesiVisinuEkrana);
      window.addEventListener("orientationchange", podesiVisinuEkrana);

      window.addEventListener("DOMContentLoaded", function () {
        if (!webAppUrl || !clientId) {
          showError("Greška: Aplikacija nije konfigurisana.");
          return;
        }

        appsScriptOrigin = getOriginFromUrl(webAppUrl);

        var savedToken = localStorage.getItem("user_google_token");
        if (savedToken && jeLiTokenValidan(savedToken)) {
          otvoriAplikaciju(savedToken);
          return;
        }

        localStorage.removeItem("user_google_token");

        var attempts = 0;
        var maxAttempts = 100;
        var checkGoogleInterval = setInterval(function () {
          attempts++;

          if (window.google && window.google.accounts) {
            clearInterval(checkGoogleInterval);

            google.accounts.id.initialize({
              client_id: clientId,
              callback: handleCredentialResponse,
              auto_select: true,
            });

            google.accounts.id.renderButton(document.getElementById("g_id_signin"), { theme: "outline", size: "small" });
            google.accounts.id.prompt();
          } else if (attempts >= maxAttempts) {
            clearInterval(checkGoogleInterval);
            showError("Nije moguće učitati Google Sign-In servise.");
          }
        }, 100);

        // Registracija Service Worker-a
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js").catch(function (err) {
            console.log("ServiceWorker greška pri registraciji:", err);
          });
        }
      });
    </script>
  </body>
</html>
