<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zakazivač</title>

    <!-- IKONICA SAJTA (Favicon za tab u browseru) -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <!-- Google Identity Services biblioteka -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #020617;
        color: #e2e8f0;
      }
      .topbar {
        padding: 12px 16px;
        border-bottom: 1px solid #1e293b;
        background: #0b1220;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .title {
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .hint {
        font-size: 14px;
        color: #94a3b8;
        margin-top: 8px;
      }
      /* Stil za veliku ikonicu iznad "Dobrodošli" */
      .login-logo {
        width: 84px;
        height: 84px;
        object-fit: contain;
        margin-bottom: 16px;
        border-radius: 16px; /* Opciono: blago zaobljene ivice */
      }
      /* Stil za iframe preko celog ekrana nakon prijave */
      .frame-wrap-full {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 99999;
        background: #020617;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .error {
        margin: 16px;
        padding: 12px 14px;
        border: 1px solid #334155;
        border-radius: 10px;
        background: #0f172a;
        color: #f8fafc;
        display: none;
      }
      .error strong {
        color: #fbbf24;
      }
      .login-overlay {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
        min-height: calc(100vh - 60px);
      }
      .login-overlay h2 {
        margin: 0;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="title">Zakazivač</div>
      <div id="auth-status">
        <!-- Prazan kontejner u koji JS ubacuje Google dugme -->
        <div id="g_id_signin"></div>
      </div>
    </div>

    <div id="error" class="error"></div>

    <div id="login-prompt" class="login-overlay">
      <!-- VEĆA IKONICA IZNAD DOBRODOŠLI -->
      <img src="favicon.png" alt="Logo" class="login-logo" />

      <h2>Dobrodošli</h2>
      <p class="hint">Molimo prijavite se putem Google naloga kako biste pristupili zakazivanju.</p>
    </div>

    <div id="frame-container" style="display: none">
      <iframe id="app-frame" title="Zakazivač"></iframe>
    </div>

    <script src="config.js"></script>
    <script>
      var frame = document.getElementById("app-frame");
      var errorBox = document.getElementById("error");
      var loginPrompt = document.getElementById("login-prompt");
      var frameContainer = document.getElementById("frame-container");

      var cfg = window.APP_CONFIG || {};
      var webAppUrl = String(cfg.appsScriptWebAppUrl || "").trim();
      var clientId = String(cfg.googleClientId || "").trim();

      // Funkcija koja se poziva kada Google vrati token
      function handleCredentialResponse(response) {
        var idToken = response.credential;

        if (!webAppUrl) {
          showError("Aplikacija nije konfigurisana (nedostaje Apps Script URL).");
          return;
        }

        // Sakrivamo nepotrebne elemente i sprečavamo skrolovanje roditeljske stranice
        document.querySelector(".topbar").style.display = "none";
        loginPrompt.style.display = "none";
        document.body.style.overflow = "hidden";

        // Širimo iframe preko celog ekrana
        frameContainer.className = "frame-wrap-full";
        frameContainer.style.display = "block";

        // Postavljamo URL sa tokenom
        frame.src = webAppUrl + "?token=" + encodeURIComponent(idToken);
      }

      function showError(msg) {
        errorBox.style.display = "block";
        errorBox.innerHTML = "<strong>" + msg + "</strong>";
      }

      window.addEventListener("DOMContentLoaded", function () {
        if (!webAppUrl || !clientId) {
          showError("Zakazivač aplikacija nije konfigurisana (proverite config.js).");
          return;
        }

        var attempts = 0;
        var maxAttempts = 100;

        var checkGoogleInterval = setInterval(function () {
          attempts++;

          if (window.google && window.google.accounts) {
            clearInterval(checkGoogleInterval);

            // Inicijalizacija sa omogućenom automatskom prijavom
            google.accounts.id.initialize({
              client_id: clientId,
              callback: handleCredentialResponse,
              auto_select: true,
            });

            // Prikaz standardnog dugmeta
            google.accounts.id.renderButton(document.getElementById("g_id_signin"), { theme: "outline", size: "small" });

            // Otvara Google prompt za brzu prijavu
            google.accounts.id.prompt();
          } else if (attempts >= maxAttempts) {
            clearInterval(checkGoogleInterval);
            showError("Nije moguće učitati Google Sign-In servise. Proverite internet vezu ili AdBlocker.");
          }
        }, 100);
      });
    </script>
  </body>
</html>
